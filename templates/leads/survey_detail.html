{% extends "partials/base.html" %}
{% block title %}Survey #{{ survey.id }}{% endblock %}
{% block content %}
<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-md-8">
      {% include 'leads/_survey_card.html' with survey=survey %}
      <div class="card mt-3 p-3">
        <h6>Notes</h6>
        <p class="text-muted">{{ survey.notes }}</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <h6>Lead</h6>
        <div><a href="{% url 'leads:lead_detail' survey.lead.id %}">{{ survey.lead.name }}</a></div>
        <div>Phone: {{ survey.lead.phone }}</div>
        <div>City: {{ survey.lead.city }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
